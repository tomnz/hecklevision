<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hecklevision! — Submit a heckle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='reset.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='submit.css') }}" />
</head>
<body>
    <main id="container">
        <header>
            <h1>Hecklevision</h1>
            <p class="intro">
                Send a message to the screen. Type <kbd>:</kbd> followed by a name to search for emoji.
            </p>
        </header>

        <form id="heckleForm" autocomplete="off">
            <label class="field">
                <span class="label">Your name</span>
                <input type="text" name="user_name" id="userName" maxlength="40" placeholder="e.g. Tom" />
            </label>

            <div class="field">
                <label for="text" class="label">Message</label>
                <div class="inputWrapper">
                    <input type="text" name="text" id="text" placeholder="Enhance! :mag:"
                           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="emojiPopup" />
                    <ul id="emojiPopup" role="listbox" hidden></ul>
                </div>
                <div class="hint">
                    <span id="charCount" aria-live="polite"></span>
                </div>
            </div>

            <div class="field">
                <span class="label">Preview</span>
                <div id="preview" class="preview empty"></div>
            </div>

            <div class="actions">
                <button type="submit" id="submit">Heckle!</button>
                <p id="response" role="status"></p>
            </div>
            <p class="hint">Heckles show up on screen about 10 seconds after sending, so no need to resend.</p>
        </form>

        <section id="recent" aria-labelledby="recentHeading">
            <h2 id="recentHeading">Recent heckles</h2>
            <ol id="recentList"></ol>
            <p id="recentEmpty" class="recentEmpty">No heckles yet. Be the first!</p>
        </section>

        <footer>
            <a href="/">Watch the stream</a> · <a href="/messages?history">Heckle history</a>
        </footer>
    </main>
    <script type="text/javascript" src="{{ url_for('static', filename='builtinEmojis.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='heckleText.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='poller.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='submit.js') }}"></script>
</body>
</html>
