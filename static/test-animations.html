<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animation Test</title>
  <!-- Pull in the real .animatedEmoji geometry so this page can't drift from the
       overlay. Everything below is page chrome, or the few overrides it needs. -->
  <link rel="stylesheet" href="messages.css">
  <style>
    html, body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* The overlay parks these behind the message stack; here there's no stream
       to sit in front of, and z-index: -1 would hide them behind the body. */
    .animatedEmoji {
      z-index: 10;
    }
    /* One fixed panel holding both rows, so the effect buttons can wrap to as
       many lines as they need without colliding with anything above them. */
    #panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 90vw;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
    }
    button:hover { background: #555; }
    button.wide { background: #2b4a63; }
    button.wide:hover { background: #3a6287; }
    button.selected { background: #c25a2b; }
    button.selected:hover { background: #d96c3b; }
    #counts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.85;
    }
    #counts button { padding: 6px 12px; font-size: 13px; }
    kbd {
      font-size: 11px;
      opacity: 0.5;
      margin-left: 6px;
    }
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 13px;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div id="animatedEmojis"></div>
  <div id="hint">Press a number key to fire that effect</div>
  <div id="panel">
    <div id="counts"><span>emoji in message:</span></div>
    <div id="controls"></div>
  </div>

  <script src="messagesAnimate.js"></script>
  <script>
    const allEmojis = [
      '&#x1F603;', '&#x1F525;', '&#x2B50;', '&#x1F389;',
      '&#x1F680;', '&#x1F308;', '&#x1F60D;', '&#x1F44D;',
      '&#x1F4A5;', '&#x1F381;', '&#x1F383;', '&#x1F47B;',
    ];

    const EMOJI_COUNTS = [1, 2, 3, 6, 12];
    let emojiCount = 3;

    // Distinct where possible, so it's obvious whether an effect is spreading the
    // message's emoji across its particles.
    const pickEmojis = (n) => {
      const pool = [];
      while (pool.length < n) {
        const shuffled = allEmojis.slice().sort(() => Math.random() - 0.5);
        pool.push(...shuffled.slice(0, Math.min(n - pool.length, shuffled.length)));
      }
      return pool;
    };

    // Fire one effect, handed a whole message's worth of emoji the way
    // messages.js does.
    const testOne = (index) => {
      animateEmojis(pickEmojis(emojiCount), animations[index]);
    };

    const testMessage = () => {
      const index = Math.floor(Math.random() * animations.length);
      testOne(index);
    };

    const counts = document.getElementById('counts');
    const countButtons = EMOJI_COUNTS.map((n) => {
      const button = document.createElement('button');
      button.innerText = n;
      button.classList.toggle('selected', n === emojiCount);
      button.addEventListener('click', () => {
        emojiCount = n;
        countButtons.forEach((b, i) => b.classList.toggle('selected', EMOJI_COUNTS[i] === n));
      });
      counts.appendChild(button);
      return button;
    });

    const controls = document.getElementById('controls');

    animations.forEach((effect, i) => {
      const button = document.createElement('button');
      button.innerText = effect.label;
      // 1-9 then 0, matching the keyboard shortcuts below.
      if (i < 10) {
        const key = document.createElement('kbd');
        key.innerText = (i + 1) % 10;
        button.appendChild(key);
      }
      button.addEventListener('click', () => testOne(i));
      controls.appendChild(button);
    });

    const messageButton = document.createElement('button');
    messageButton.innerText = 'Random Effect';
    messageButton.classList.add('wide');
    messageButton.addEventListener('click', testMessage);
    controls.appendChild(messageButton);

    document.addEventListener('keydown', (e) => {
      if (!/^[0-9]$/.test(e.key)) return;
      const index = (parseInt(e.key, 10) + 9) % 10; // '1' → 0, '0' → 9
      if (index < animations.length) testOne(index);
    });
  </script>
</body>
</html>
